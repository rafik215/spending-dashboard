<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spending Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --ink: #1e1e1e;
    --muted: #6b6b6b;
    --line: #e6e6e2;
    --accent: #2563eb;
    --pos: #16a34a;
    --neg: #dc2626;
    --warn: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.45; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  h1 { font-size: 22px; }
  h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  a { color: var(--accent); text-decoration: none; }

  #app { display: none; padding: 24px 32px 60px; max-width: 1400px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  header .meta { color: var(--muted); font-size: 12px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .kpi .pos { color: var(--pos); }
  .kpi .neg { color: var(--neg); }

  .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-1 { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .card .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  select, input[type=text] { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: white; }

  .chart-wrap { position: relative; height: 320px; }
  .chart-wrap.short { height: 240px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  td.amount, th.amount { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .neg { color: var(--neg); }
  .pos { color: var(--pos); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; font-size: 11px; }

  .table-scroll { max-height: 480px; overflow-y: auto; }

  #vendorList { list-style: none; padding: 0; margin: 0; }
  #vendorList li { display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  #vendorList li:last-child { border-bottom: none; }
  #vendorList .vname { font-weight: 500; }
  #vendorList .vsub { color: var(--muted); font-size: 11px; margin-left: 8px; }

  #anomalies { list-style: none; padding: 0; margin: 0; }
  #anomalies li { padding: 8px 12px; margin-bottom: 6px; border-left: 3px solid var(--warn);
    background: #fffbeb; border-radius: 4px; font-size: 13px; }
  #anomalies li strong { color: var(--warn); }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; padding: 8px 0; }

  /* Login overlay */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; z-index: 100; }
  #login .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 32px 36px; width: min(420px, 90vw); text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.06); }
  #login h1 { font-size: 20px; margin-bottom: 8px; }
  #login p { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  #login input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 12px; }
  #login button { width: 100%; padding: 10px 14px; font: inherit; font-weight: 500;
    color: white; background: var(--ink); border: none; border-radius: 8px; cursor: pointer; }
  #login button:disabled { opacity: 0.6; cursor: not-allowed; }
  #login .err { color: var(--neg); font-size: 12px; margin-top: 10px; min-height: 16px; }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    #app { padding: 16px; }
  }
</style>
</head>
<body>

<!-- Login overlay -->
<div id="login">
  <div class="box">
    <h1>Spending dashboard</h1>
    <p>Enter your password to decrypt.</p>
    <input type="password" id="pw" autocomplete="current-password" autofocus placeholder="Password">
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:-6px 0 12px;cursor:pointer;user-select:none;">
      <input type="checkbox" id="showpw"> Show password
    </label>
    <button id="unlock">Unlock</button>
    <div class="err" id="err"></div>
    <div style="margin-top:14px;font-size:10px;color:var(--muted);">Build: <span id="buildStamp"></span></div>
  </div>
</div>

<!-- Dashboard app (hidden until decrypted) -->
<div id="app">
  <header>
    <div>
      <h1>Spending dashboard</h1>
      <div class="meta" id="metaLine"></div>
    </div>
    <div>
      <a href="#" id="logout" style="font-size:12px;">Lock &nbsp;⟳</a>
    </div>
  </header>

  <!-- KPI header -->
  <div class="kpi-grid" id="kpis"></div>

  <!-- Row: Category pie + Top vendors -->
  <div class="grid-2">
    <div class="card">
      <div class="controls">
        <h2 style="margin:0;">Category breakdown</h2>
        <span style="flex:1;"></span>
        <label for="catMonth">Period:</label>
        <select id="catMonth"></select>
      </div>
      <div class="chart-wrap"><canvas id="pie"></canvas></div>
    </div>
    <div class="card">
      <div class="controls">
        <h2 style="margin:0;">Top vendors</h2>
        <span style="flex:1;"></span>
        <label for="vendorMonth">Period:</label>
        <select id="vendorMonth"></select>
      </div>
      <ol id="vendorList"></ol>
    </div>
  </div>

  <!-- Monthly trend line -->
  <div class="grid-1">
    <div class="card">
      <div class="controls">
        <h2 style="margin:0;">Monthly trend</h2>
        <span style="flex:1;"></span>
        <label for="trendMode">Show:</label>
        <select id="trendMode">
          <option value="total">Total spending per month</option>
          <option value="perCat">Spending per category (toggle in legend)</option>
        </select>
      </div>
      <div class="chart-wrap"><canvas id="trend"></canvas></div>
    </div>
  </div>

  <!-- Budget vs Actual -->
  <div class="grid-1">
    <div class="card">
      <div class="controls">
        <h2 style="margin:0;">Budget vs. actual</h2>
        <span style="flex:1;"></span>
        <label for="budgetMonth">Month:</label>
        <select id="budgetMonth"></select>
      </div>
      <div class="chart-wrap short"><canvas id="budget"></canvas></div>
      <div id="budgetNote" class="empty" style="display:none;"></div>
    </div>
  </div>

  <!-- Anomaly flags -->
  <div class="grid-1">
    <div class="card">
      <h2>Anomaly flags <span style="font-size:11px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0;">(month &gt; 50% above the trailing 3-month average)</span></h2>
      <ul id="anomalies"></ul>
    </div>
  </div>

  <!-- Transaction table -->
  <div class="grid-1">
    <div class="card">
      <div class="controls">
        <h2 style="margin:0;">Transactions</h2>
        <span style="flex:1;"></span>
        <input type="text" id="txnSearch" placeholder="Search vendor/notes…" style="min-width:220px;">
        <label for="txnMonth">Month:</label>
        <select id="txnMonth"></select>
        <label for="txnCat">Category:</label>
        <select id="txnCat"></select>
        <span id="txnCount" style="margin-left:8px;"></span>
      </div>
      <div class="table-scroll">
        <table id="txnTable">
          <thead><tr>
            <th>Date</th><th>Card</th><th>Vendor</th><th>Category</th><th>Notes</th><th class="amount">Amount</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

// ---------------------------------------------------------------- crypto
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false, ["decrypt"]
  );
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function decryptData(password) {
  const raw = b64ToBytes(ENC_DATA);
  if (raw.length < 16 + 12 + 16) throw new Error("Encrypted blob too short.");
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const ct   = raw.slice(28);
  const key = await deriveKey(password, salt);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---------------------------------------------------------------- helpers
const fmt$ = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const fmt$c = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
const fmt$signed = (n) => (n >= 0 ? "" : "−") + Math.abs(n).toLocaleString("en-US", { style: "currency", currency: "USD" });
function unique(arr) { return [...new Set(arr)]; }
function groupBy(arr, keyFn) {
  const out = new Map();
  for (const x of arr) {
    const k = keyFn(x);
    if (!out.has(k)) out.set(k, []);
    out.get(k).push(x);
  }
  return out;
}
function monthLabel(m) {
  // "2026-05" -> "May 2026"
  const [y, mo] = m.split("-").map(Number);
  return new Date(y, mo - 1, 1).toLocaleString("en-US", { month: "short", year: "numeric" });
}
function isExpense(t) {
  const c = (t.category || "").toString().trim();
  return t.amount > 0 && !["Deposit - Salary", "Deposit - Other", "CC Payment"].includes(c);
}
function isIncome(t) {
  const c = (t.category || "").toString().trim();
  return t.amount < 0 && ["Deposit - Salary", "Deposit - Other"].includes(c);
}

let DATA = null;

// ---------------------------------------------------------------- render
function computeKPIs() {
  const byMonth = groupBy(DATA.transactions, t => t.month);
  const monthList = [...byMonth.keys()].sort();
  const latest = monthList[monthList.length - 1] || "";
  const prior = monthList[monthList.length - 2] || "";

  const ytdIncome  = -DATA.transactions.filter(isIncome).reduce((a,t)=>a+t.amount, 0);
  const ytdExpense =  DATA.transactions.filter(isExpense).reduce((a,t)=>a+t.amount, 0);
  const ytdNet = ytdIncome - ytdExpense;

  const monthsWithSpend = monthList.filter(m => byMonth.get(m).some(isExpense)).length;
  const avgBurn = monthsWithSpend > 0 ? ytdExpense / monthsWithSpend : 0;

  const monthTotal = (m) => (byMonth.get(m) || []).filter(isExpense).reduce((a,t)=>a+t.amount, 0);
  const latestSpend = monthTotal(latest);
  const priorSpend  = monthTotal(prior);
  const delta = priorSpend > 0 ? (latestSpend - priorSpend) / priorSpend : null;

  return { ytdIncome, ytdExpense, ytdNet, avgBurn, latest, latestSpend, prior, delta };
}
function renderKPIs() {
  const k = computeKPIs();
  const deltaEl = k.delta === null ? "—" :
    `<span class="${k.delta > 0 ? 'neg' : 'pos'}">${k.delta > 0 ? '▲' : '▼'} ${Math.abs(k.delta*100).toFixed(1)}%</span>`;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="label">YTD Income</div><div class="value pos">${fmt$(k.ytdIncome)}</div><div class="sub">All 2026</div></div>
    <div class="kpi"><div class="label">YTD Expenses</div><div class="value neg">${fmt$(k.ytdExpense)}</div><div class="sub">All 2026</div></div>
    <div class="kpi"><div class="label">YTD Net</div><div class="value ${k.ytdNet>=0?'pos':'neg'}">${fmt$(k.ytdNet)}</div><div class="sub">Income − Expenses</div></div>
    <div class="kpi"><div class="label">Avg monthly burn</div><div class="value">${fmt$(k.avgBurn)}</div><div class="sub">Across months with spending</div></div>
    <div class="kpi"><div class="label">${k.latest ? monthLabel(k.latest) : ''} spend</div><div class="value">${fmt$(k.latestSpend)}</div><div class="sub">${k.prior ? 'vs ' + monthLabel(k.prior) + ': ' + deltaEl : ''}</div></div>
  `;
}

  const byCat = new Map();
  for (const r of rows) byCat.set(r.category, (byCat.get(r.category) || 0) + r.amount);
  const entries = [...byCat.entries()].sort((a,b) => b[1] - a[1]);
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const total = values.reduce((a,b)=>a+b, 0);

  if (charts.pie) charts.pie.destroy();
  charts.pie = new Chart(document.getElementById("pie"), {
    type: "doughnut",
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: labels.map((_,i) => colorFor(i)), borderWidth: 1, borderColor: "#fff" }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: "right", labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: {
          label: (ctx) => `${ctx.label}: ${fmt$c(ctx.raw)} (${(ctx.raw/total*100).toFixed(1)}%)`
        }}
      }
    }
  });
}

function renderVendors() {
  const period = document.getElementById("vendorMonth").value;
  const rows = DATA.transactions.filter(isExpense).filter(t => period === "YTD" || t.month === period);
  const byV = new Map();
  for (const r of rows) {
    const v = (r.vendor || "(unknown)");
    if (!byV.has(v)) byV.set(v, { total: 0, count: 0 });
    const o = byV.get(v);
    o.total += r.amount; o.count += 1;
  }
  const top = [...byV.entries()].sort((a,b) => b[1].total - a[1].total).slice(0, 15);
  document.getElementById("vendorList").innerHTML = top.map(([v, o]) =>
    `<li><span><span class="vname">${escapeHtml(v)}</span><span class="vsub">${o.count} txn${o.count===1?'':'s'}</span></span><span class="amount">${fmt$c(o.total)}</span></li>`
  ).join("") || `<li class="empty">No transactions.</li>`;
}

function renderTrend() {
  const mode = document.getElementById("trendMode").value;
  if (charts.trend) charts.trend.destroy();
  if (mode === "total") {
    const totals = months.map(m => DATA.transactions.filter(t => t.month === m).filter(isExpense).reduce((a,t)=>a+t.amount, 0));
    charts.trend = new Chart(document.getElementById("trend"), {
      type: "line",
      data: {
        labels: months.map(monthLabel),
        datasets: [{ label: "Total spending", data: totals, borderColor: PALETTE[0],
          backgroundColor: PALETTE[0]+"20", fill: true, tension: 0.25, borderWidth: 2 }]
      },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmt$c(c.raw) } } },
        scales: { y: { ticks: { callback: (v) => fmt$(v) } } }
      }
    });
  } else {
    // per category, stacked area? use lines to allow legend toggle
    const datasets = expenseCats.map((c, i) => ({
      label: c,
      data: months.map(m => DATA.transactions.filter(t => t.month===m && t.category===c && isExpense(t)).reduce((a,t)=>a+t.amount, 0)),
      borderColor: colorFor(i), backgroundColor: colorFor(i)+"22",
      borderWidth: 1.5, tension: 0.25, pointRadius: 2, hidden: i >= 6
    }));
    charts.trend = new Chart(document.getElementById("trend"), {
      type: "line",
      data: { labels: months.map(monthLabel), datasets },
      options: { responsive: true, maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
                   tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmt$c(c.raw)}` } } },
        scales: { y: { ticks: { callback: (v) => fmt$(v) } } }
      }
    });
  }
}

function renderBudget() {
  const m = document.getElementById("budgetMonth").value;
  const budgets = DATA.monthly_budgets || {};
  const catsWithBudget = Object.keys(budgets);
  const noteEl = document.getElementById("budgetNote");
  if (charts.budget) charts.budget.destroy();
  if (catsWithBudget.length === 0) {
    noteEl.style.display = "block";
    noteEl.textContent = "No budgets set. Fill in the Monthly Budget column in the workbook to see this chart.";
    document.getElementById("budget").style.display = "none";
    return;
  }
  document.getElementById("budget").style.display = "";
  noteEl.style.display = "none";
  const actuals = catsWithBudget.map(c =>
    DATA.transactions.filter(t => t.month === m && t.category === c && isExpense(t)).reduce((a,t)=>a+t.amount, 0));
  const budgetsArr = catsWithBudget.map(c => budgets[c]);
  charts.budget = new Chart(document.getElementById("budget"), {
    type: "bar",
    data: {
      labels: catsWithBudget,
      datasets: [
        { label: "Budget",  data: budgetsArr, backgroundColor: "#e6e6e2" },
        { label: "Actual",  data: actuals,    backgroundColor: actuals.map((a, i) => a > budgetsArr[i] ? "#dc2626" : "#16a34a") },
      ]
    },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${fmt$c(c.raw)}` } } },
      scales: { y: { ticks: { callback: (v) => fmt$(v) } } }
    }
  });
}

function renderAnomalies() {
  const ul = document.getElementById("anomalies");
  if (months.length < 4) { ul.innerHTML = `<li class="empty">Need at least 4 months of data.</li>`; return; }
  const latest = months[months.length - 1];
  const trailing = months.slice(months.length - 4, months.length - 1); // 3 prior
  const flags = [];
  for (const c of expenseCats) {
    const cur = DATA.transactions.filter(t => t.month === latest && t.category === c && isExpense(t)).reduce((a,t)=>a+t.amount, 0);
    const priorAvg = trailing.reduce((a, m) =>
      a + DATA.transactions.filter(t => t.month === m && t.category === c && isExpense(t)).reduce((s,t)=>s+t.amount, 0), 0) / trailing.length;
    if (priorAvg > 20 && cur > priorAvg * 1.5) {
      flags.push({ cat: c, cur, priorAvg, jump: ((cur - priorAvg) / priorAvg * 100) });
    }
  }
  flags.sort((a,b) => b.jump - a.jump);
  ul.innerHTML = flags.length === 0
    ? `<li class="empty">No anomalies in ${monthLabel(latest)}.</li>`
    : flags.map(f =>
        `<li><strong>${escapeHtml(f.cat)}</strong> in ${monthLabel(latest)}: ${fmt$c(f.cur)}
          (${f.jump.toFixed(0)}% above prior 3-mo avg of ${fmt$c(f.priorAvg)})</li>`
      ).join("");
}

function renderTxns() {
  const q = (document.getElementById("txnSearch").value || "").toLowerCase();
  const m = document.getElementById("txnMonth").value;
  const cat = document.getElementById("txnCat").value;
  let rows = DATA.transactions;
  if (m !== "ALL") rows = rows.filter(t => t.month === m);
  if (cat !== "ALL") rows = rows.filter(t => t.category === cat);
  if (q) rows = rows.filter(t => ((t.vendor||"") + " " + (t.notes||"") + " " + (t.category||"")).toLowerCase().includes(q));
  rows = rows.slice().sort((a,b) => (a.date < b.date ? 1 : -1));

  const body = document.querySelector("#txnTable tbody");
  const limit = 500;
  body.innerHTML = rows.slice(0, limit).map(t =>
    `<tr>
       <td>${t.date}</td>
       <td>${escapeHtml(t.card)}</td>
       <td>${escapeHtml(t.vendor)}</td>
       <td><span class="tag">${escapeHtml(t.category)}</span></td>
       <td>${escapeHtml(t.notes)}</td>
       <td class="amount ${t.amount<0?'pos':''}">${fmt$signed(t.amount)}</td>
     </tr>`
  ).join("");
  const count = document.getElementById("txnCount");
  count.textContent = rows.length > limit ? `${rows.length} txns (showing ${limit})` : `${rows.length} txns`;
  count.style.color = "var(--muted)";
  count.style.fontSize = "11px";
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

// ---------------------------------------------------------------- setup
function fillMonthSelect(id, includeYTD, includeALL) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  if (includeALL) el.appendChild(new Option("All months", "ALL"));
  if (includeYTD) el.appendChild(new Option("YTD (all months)", "YTD"));
  for (let i = months.length - 1; i >= 0; i--) el.appendChild(new Option(monthLabel(months[i]), months[i]));
  if (includeYTD) el.value = "YTD";
  else el.value = months[months.length - 1] || "";
}

function bootDashboard() {
  months = unique(DATA.transactions.map(t => t.month)).sort();
  // canonical order of expense categories from Settings, filtered to those present in data
  const present = new Set(DATA.transactions.filter(isExpense).map(t => t.category));
  expenseCats = DATA.categories.filter(c => present.has(c));

  // Meta line
  const genUtc = GENERATED_AT ? new Date(GENERATED_AT.replace("Z","")).toLocaleString() : "";
  document.getElementById("metaLine").textContent =
    `${TXN_COUNT} transactions · ${months.length} months · data as of ${genUtc}`;

  // Populate selectors
  fillMonthSelect("catMonth", true, false);
  fillMonthSelect("vendorMonth", true, false);
  fillMonthSelect("budgetMonth", false, false);
  fillMonthSelect("txnMonth", false, true);
  const txnCatSel = document.getElementById("txnCat");
  txnCatSel.innerHTML = `<option value="ALL">All categories</option>` +
    DATA.categories.map(c => `<option>${escapeHtml(c)}</option>`).join("");

  // Wire up events
  document.getElementById("catMonth").addEventListener("change", renderPie);
  document.getElementById("vendorMonth").addEventListener("change", renderVendors);
  document.getElementById("trendMode").addEventListener("change", renderTrend);
  document.getElementById("budgetMonth").addEventListener("change", renderBudget);
  document.getElementById("txnMonth").addEventListener("change", renderTxns);
  document.getElementById("txnCat").addEventListener("change", renderTxns);
  document.getElementById("txnSearch").addEventListener("input", renderTxns);
  document.getElementById("logout").addEventListener("click", (e) => { e.preventDefault(); location.reload(); });

  renderKPIs();
  renderPie();
  renderVendors();
  renderTrend();
  renderBudget();
  renderAnomalies();
  renderTxns();

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
}

// ---------------------------------------------------------------- unlock
async function unlock() {
  const btn = document.getElementById("unlock");
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Decrypting…";
  try {
    DATA = await decryptData(pw);
    bootDashboard();
  } catch (e) {
    err.textContent = "Wrong password.";
    btn.disabled = false; btn.textContent = "Unlock";
    document.getElementById("pw").focus();
    document.getElementById("pw").select();
  }
}
document.getElementById("unlock").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
document.getElementById("showpw").addEventListener("change", (e) => {
  document.getElementById("pw").type = e.target.checked ? "text" : "password";
});
// Stamp the build timestamp on the login screen so a cached page is obvious
document.getElementById("buildStamp").textContent = GENERATED_AT || "(unknown)";
</script>
